# Fail if the committed assets don't match a fresh build
# (Composer and Git Updater install straight from the repo, without building)
name: Assets

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code assets
